<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -45 60 90">
    <!-- Pin to its bus (top) -->
    <line x1="0" y1="-41" x2="0" y2="-30" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Its winding, interconnected star (zigzag) -->
    <circle cx="0" cy="-16" r="14" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
    <polyline points="-7,-22 0,-16 -7,-10" fill="none" stroke="#1a1a2e" stroke-width="1.5" stroke-linejoin="round"/>
    <polyline points="0,-16 7,-16" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
    <polyline points="7,-16 4,-21" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Star point down through its neutral resistor -->
    <line x1="0" y1="-2" x2="0" y2="6" stroke="#1a1a2e" stroke-width="1.5"/>
    <rect x="-5" y="6" width="10" height="18" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="0" y1="24" x2="0" y2="31" stroke="#1a1a2e" stroke-width="1.5"/>
    <!-- Earth -->
    <line x1="-11" y1="31" x2="11" y2="31" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="-7" y1="35" x2="7" y2="35" stroke="#1a1a2e" stroke-width="1.5"/>
    <line x1="-3" y1="39" x2="3" y2="39" stroke="#1a1a2e" stroke-width="1.5"/>
</svg>
