<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-38 -20 76 40">
    <!-- DC diode: anode on the left pin, cathode on the right; conducts left to right only -->
    <line x1="-38" y1="0" x2="-9" y2="0" stroke="#1a1a2e" stroke-width="2"/>
    <polygon points="-9,-9 -9,9 8,0" fill="#1a1a2e" stroke="#1a1a2e" stroke-width="1.5" stroke-linejoin="round"/>
    <line x1="9" y1="-10" x2="9" y2="10" stroke="#1a1a2e" stroke-width="2.5"/>
    <line x1="9" y1="0" x2="38" y2="0" stroke="#1a1a2e" stroke-width="2"/>
    <text x="0" y="19" text-anchor="middle" font-family="monospace" font-size="8" font-weight="bold" fill="#c0392b">DC</text>
</svg>
