<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 -44 50 64">
    <!-- Supercapacitor: the lead to its DC bus at the top, a double-layer capacitor (two plates, each with its layer), the return pole below -->
    <line x1="0" y1="-42" x2="0" y2="-14" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="-16" y1="-14" x2="16" y2="-14" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="-16" y1="-9" x2="16" y2="-9" stroke="#1a1a2e" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="-16" y1="-3" x2="16" y2="-3" stroke="#1a1a2e" stroke-width="1.2" stroke-dasharray="2 2"/>
    <line x1="-16" y1="2" x2="16" y2="2" stroke="#1a1a2e" stroke-width="3"/>
    <line x1="0" y1="2" x2="0" y2="12" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="-12" y1="12" x2="12" y2="12" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="-7" y1="16" x2="7" y2="16" stroke="#1a1a2e" stroke-width="2"/>
    <text x="-20" y="-17" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#1a1a2e">+</text>
    <text x="17" y="-20" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" fill="#c0392b">SC</text>
</svg>
